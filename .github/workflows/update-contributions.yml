name: Update GitHub Contributions Feed

on:
  schedule:
    # Run daily at 6:00 AM EST (11:00 AM UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Clear Jekyll cache to force PR data refresh
        run: |
          rm -rf .jekyll-cache
          echo "Jekyll cache cleared - PR data will be refreshed on next build"
      
      - name: Create empty commit to trigger rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Update contributions feed [automated]"
          git push
